<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonténégroTour</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #013a63;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .section {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #013a63;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🇲🇪 Bienvenue au MonténégroTour</h1>
    <p>Découvrez les plus beaux paysages du Monténégro</p>
  </header>

  <section class="section">
    <h2>🌄 Galerie Photo</h2>
    <div class="gallery">
      <img src="https://source.unsplash.com/600x400/?kotor,montenegro" alt="Kotor">
      <img src="https://source.unsplash.com/600x400/?budva,montenegro" alt="Budva">
      <img src="https://source.unsplash.com/600x400/?durmitor,montenegro" alt="Durmitor">
      <img src="https://source.unsplash.com/600x400/?montenegro,beach" alt="Plage au Monténégro">
      <img src="https://source.unsplash.com/600x400/?montenegro,nature" alt="Nature Monténégro">
    </div>
  </section>

  <footer>
    <p>&copy; 2025 MonténégroTour - Tous droits réservés</p>
  </footer>

</body>
</html>
